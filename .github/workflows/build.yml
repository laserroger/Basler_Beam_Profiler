name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-basler.txt pyinstaller
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --onefile pylon_camera.py
      - uses: actions/upload-artifact@v4
        with:
          name: pylon_camera-windows
          path: dist/pylon_camera.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS app and DMG (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install dependencies
        run: python -m pip install -r requirements-basler.txt pyinstaller
      - name: Build macOS app
        run: python -m PyInstaller --noconfirm pylon_camera.spec
      - name: Smoke-test packaged app
        run: dist/pylon_camera.app/Contents/MacOS/pylon_camera --sim --frames 3
      - name: Create macOS disk image
        run: |
          mkdir -p dmg_temp
          cp -R dist/pylon_camera.app dmg_temp/
          cp docs/macos.md dmg_temp/README.md
          ln -s /Applications dmg_temp/Applications
          hdiutil create dist/pylon_camera-macos-arm64.dmg -volname BeamProfiler -srcfolder dmg_temp -ov -format UDZO
      - uses: actions/upload-artifact@v4
        with:
          name: pylon_camera-macos-arm64
          path: dist/pylon_camera-macos-arm64.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pylon_camera-*
          path: artifacts
          merge-multiple: true
      - name: Generate release tag
        id: tag
        run: echo "value=v$(date -u +%Y.%m.%d.%H%M%S)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Beam Profiler ${{ steps.tag.outputs.value }}
          body: |
            Windows executable and Apple Silicon macOS app.

            macOS: open the DMG and drag pylon_camera.app into Applications.
            The app is ad-hoc signed, not Apple-notarized. Configuration and saved
            frames are under ~/Library/Application Support/BeamProfiler.

            Basler and simulation support are included. FLIR requires a separate
            Spinnaker SDK and matching Python 3.12 ARM64 binding installation;
            see docs/macos.md for the packaged-app instructions.
          files: |
            artifacts/pylon_camera.exe
            artifacts/pylon_camera-macos-arm64.dmg
          fail_on_unmatched_files: true
